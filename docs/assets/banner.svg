<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
  <title id="title">postcss-adaptive-matrix</title>
  <desc id="desc">postcss-adaptive-matrix：一张设计稿，一个画布。面向多端设计系统的 PostCSS 8 响应式编译器。</desc>

  <style>
    .name { font: 700 34px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #1f2933 }
    .tag  { font: 400 16px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b83208 }
    .meta { font: 400 13px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7783 }
    .mark { fill: none; stroke: #b83208; stroke-width: 2.4 }
    .fill { fill: #b83208; opacity: .13 }
    .rule { stroke: #e6ebf0; stroke-width: 1 }

    @media (prefers-color-scheme: dark) {
      .name { fill: #e6edf3 }
      .tag  { fill: #ff9f7a }
      .meta { fill: #8b949e }
      .mark { stroke: #ff9f7a }
      .fill { fill: #ff9f7a; opacity: .16 }
      .rule { stroke: #21262d }
    }
  </style>

  <!-- 标记：三个宽度不同的画布，落在同一条基线上 -->
  <g transform="translate(48 52)">
    <rect class="fill" x="0"  y="60" width="26" height="36" rx="4"/>
    <rect class="mark" x="0"  y="60" width="26" height="36" rx="4"/>
    <rect class="fill" x="34" y="34" width="26" height="62" rx="4"/>
    <rect class="mark" x="34" y="34" width="26" height="62" rx="4"/>
    <rect class="fill" x="68" y="4"  width="26" height="92" rx="4"/>
    <rect class="mark" x="68" y="4"  width="26" height="92" rx="4"/>
  </g>

  <text class="name" x="184" y="86">postcss-adaptive-matrix</text>
  <text class="tag"  x="186" y="116">一张设计稿，一个画布</text>
  <text class="meta" x="186" y="142">多画布响应式编译 · 有界流体尺寸 · 可缩放文字 · 组件库开箱适配</text>

  <line class="rule" x1="184" y1="160" x2="852" y2="160"/>
  <text class="meta" x="184" y="180">PostCSS 8 · TypeScript · ESM + CJS · MIT</text>
</svg>
