name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Vitest 4's runner needs Node 20+, while the shipped plugin supports Node 18.
  # Exercise the real ESM, CommonJS, runtime and CLI artefacts on that minimum
  # independently so a dev-tool engine cannot silently narrow the public one.
  runtime-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:runtime

      # Verify the declared peer floor without changing the committed lockfile.
      # Kept separate from security: this old release is a compatibility target,
      # not the recommended dependency version for consumers.
      - name: Install minimum supported PostCSS
        run: npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund postcss@8.4.0
      - name: Smoke test minimum PostCSS on Node 18
        run: npm run smoke:runtime

  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - run: npm run smoke:runtime

  # Its own job, on one Node version. A performance budget is not a correctness
  # check: running it across the matrix would multiply the exposure to a noisy
  # runner without measuring anything the first run did not, and a failure here
  # should read as "this got slower", not as "the tests broke on Node 20".
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bench:check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:check
