name: Bug 报告
description: 报告可复现的转换错误
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请移除业务敏感信息并提供最小复现。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 最小 CSS 与配置
      render: css
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际输出
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望输出
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js、PostCSS 与构建工具版本
    validations:
      required: true
